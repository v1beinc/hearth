<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Hearth — музыка</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 18px; background: #181316; color: #ddc6ac;
         font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; color: #ffe4b1; }
  p { margin: 4px 0 14px; }
  a { color: #dba875; }
  #frame { width: 100%; aspect-ratio: 16 / 9; min-height: 200px; background: #100d10; }
  #player { width: 100%; height: 100%; border: 0; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 14px 0; }
  button { padding: 9px 14px; color: #ffe4b1; background: #503325; border: 1px solid #89633f;
           border-radius: 8px; cursor: pointer; font: inherit; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid #ffe4b1; outline-offset: 3px; }
  input[type="range"] { accent-color: #dba875; min-width: 0; }
  #seek { width: 100%; }
  #time { font-variant-numeric: tabular-nums; margin-left: auto; }
  #status { color: #b8a28e; font-size: 12px; min-height: 36px; }
</style>
</head>
<body>
<main>
  <h1>Музыка для тихого вечера</h1>
  <p>Lofi mix · <a href="https://www.youtube.com/watch?v=LTphVIore3A" target="_blank" rel="noopener">Открыть на YouTube ↗</a></p>
  <div id="frame"><div id="player"></div></div>
  <div class="row">
    <button id="play" disabled>Слушать</button>
    <button id="back" disabled aria-label="Назад на 30 секунд">−30 с</button>
    <button id="forward" disabled aria-label="Вперёд на 30 секунд">+30 с</button>
    <span id="time">0:00 / —</span>
  </div>
  <input id="seek" type="range" min="0" max="1" step="1" value="0" disabled aria-label="Перемотка">
  <div class="row">
    <label for="volume">Громкость</label>
    <input id="volume" type="range" min="0" max="100" value="35">
    <output id="volume-value" for="volume">35%</output>
    <label><input id="repeat" type="checkbox" checked> Повтор</label>
  </div>
  <p id="status" role="status">Загружаем YouTube. Музыка начнётся после нажатия «Слушать».</p>
</main>
<script src="music.js"></script>
</body>
</html>
